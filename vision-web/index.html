<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Coast Dental</title>
<link rel="stylesheet" href="style.css">

<header class="bar">
  <div class="bar-left">
    <strong>Bright Coast Dental</strong>
    <span id="chip" class="chip chip-live">Live</span>
  </div>
  <div class="bar-right">
    <label class="mode" title="Turn this off to see how it behaved before the fix">
      <input type="checkbox" id="plain" checked>
      <span>Plain language</span>
    </label>
    <button id="publish" class="btn btn-primary">Update project</button>
  </div>
</header>

<main class="split">
  <section class="chat" aria-label="Chat">
    <div id="log" class="log"></div>
    <form id="form" class="composer">
      <input id="input" placeholder="make the logo bigger" autocomplete="off" required>
      <button class="btn" id="send">Send</button>
    </form>
  </section>

  <section class="right">
    <div class="tabs" role="tablist">
      <button class="tab is-on" data-pane="preview" role="tab">Preview</button>
      <button class="tab" data-pane="live" role="tab">Live site</button>
      <button class="tab" data-pane="editor" role="tab">Editor</button>
      <span class="tab-note" id="tabNote">what you're working on</span>
    </div>

    <div class="pane is-on" data-pane="preview"><iframe id="preview" title="Preview"></iframe></div>
    <div class="pane" data-pane="live">
      <iframe id="live" title="Live site"></iframe>
    </div>
    <div class="pane" data-pane="editor">
      <div class="editor">
        <div class="files" id="files"></div>
        <textarea id="code" spellcheck="false" aria-label="File contents"></textarea>
      </div>
    </div>
  </section>
</main>

<aside class="history">
  <h2>Your versions</h2>
  <ul id="versions"></ul>
</aside>

<dialog id="keyDialog">
  <form method="dialog" class="keyform">
    <h2>Connect your accounts</h2>
    <p>Both are kept in this browser only and are never part of this repository.</p>
    <label class="keylabel" for="keyInput">Gemini API key</label>
    <input id="keyInput" type="password" placeholder="AQ..." autocomplete="off">
    <label class="keylabel" for="tokenInput">
      GitHub token, so changes can go live
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=vision-mini" target="_blank" rel="noreferrer">get one</a>
    </label>
    <input id="tokenInput" type="password" placeholder="ghp_..." autocomplete="off">
    <div class="keyrow">
      <button class="btn btn-primary" id="keySave" value="save">Save</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</html>
